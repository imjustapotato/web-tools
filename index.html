<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken's Web Tools</title>
    <link rel="stylesheet" href="./src/styles/tailwind.css">
    <link rel="stylesheet" href="./src/styles/home.css">
    <link rel="icon" href="./src/assets/logo100.png" type="image/png">
</head>

<!-- Theme toggle: Swap 'theme-liquid' with 'theme-glassmorph' on body. -->

<body class="theme-liquid">
    <main class="home-shell centered">

        <div class="aurora-background" aria-hidden="true">
            <div class="aurora-stars"></div>

            <div class="aurora-curtains">
                <div class="aurora-band aurora-band-one"></div>
                <div class="aurora-band aurora-band-two"></div>
                <div class="aurora-band aurora-band-three"></div>
            </div>

            <div class="aurora-horizon"></div>

            <div class="aurora-mountains">
                <svg viewBox="0 0 1440 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#0a1020;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#020510;stop-opacity:1" />
                        </linearGradient>
                        <filter id="cityGlow">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" />
                        </filter>
                    </defs>

                    <!-- Background Huge Mountain -->
                    <path d="M-100,300 L300,100 L720,20 L1140,100 L1540,300 Z" fill="#040816" opacity="0.4" />

                    <!-- Midground Mountain Range -->
                    <path d="M0,300 L150,150 L350,220 L550,120 L750,200 L950,80 L1150,220 L1350,140 L1500,300 Z"
                        fill="url(#mountainGrad)" />

                    <!-- City Skyline -->
                    <g class="city-silhouettes" fill="#01030a">
                        <!-- Left Cluster -->
                        <rect x="100" y="240" width="25" height="60" />
                        <rect x="130" y="210" width="30" height="90" />
                        <rect x="165" y="230" width="20" height="70" />
                        <rect x="190" y="250" width="15" height="50" />

                        <!-- Central-Left Cluster -->
                        <rect x="350" y="220" width="35" height="80" />
                        <rect x="390" y="245" width="20" height="55" />
                        <rect x="415" y="200" width="25" height="100" />
                        <rect x="445" y="230" width="30" height="70" />

                        <!-- Central Cluster (Taller Buildings) -->
                        <rect x="680" y="180" width="40" height="120" />
                        <rect x="725" y="160" width="35" height="140" />
                        <rect x="765" y="195" width="25" height="105" />
                        <rect x="795" y="215" width="30" height="85" />

                        <!-- Right Cluster -->
                        <rect x="1100" y="225" width="25" height="75" />
                        <rect x="1130" y="205" width="35" height="95" />
                        <rect x="1170" y="240" width="20" height="60" />
                        <rect x="1200" y="215" width="30" height="85" />
                    </g>

                    <!-- City Lights -->
                    <g class="city-lights" fill="#ffd700" filter="url(#cityGlow)">
                        <!-- Lights for Left Cluster -->
                        <rect x="105" y="250" width="2" height="2" opacity="0.6" />
                        <rect x="115" y="250" width="2" height="2" opacity="0.4" />
                        <rect x="135" y="220" width="2" height="2" opacity="0.8" />
                        <rect x="145" y="220" width="2" height="2" opacity="0.6" />
                        <rect x="135" y="235" width="2" height="2" opacity="0.9" />
                        <rect x="145" y="235" width="2" height="2" opacity="0.5" />
                        <rect x="135" y="250" width="2" height="2" opacity="0.7" />
                        <rect x="172" y="240" width="2" height="2" opacity="0.8" />
                        <rect x="172" y="255" width="2" height="2" opacity="0.6" />
                        <rect x="195" y="260" width="2" height="2" opacity="0.5" />

                        <!-- Lights for Central-Left -->
                        <rect x="360" y="230" width="2" height="2" opacity="0.7" />
                        <rect x="360" y="245" width="2" height="2" opacity="0.9" />
                        <rect x="395" y="255" width="2" height="2" opacity="0.6" />
                        <rect x="422" y="210" width="2" height="2" opacity="0.8" />
                        <rect x="422" y="225" width="2" height="2" opacity="0.6" />
                        <rect x="422" y="240" width="2" height="2" opacity="0.9" />
                        <rect x="455" y="240" width="2" height="2" opacity="0.7" />

                        <!-- Lights for Central Cluster -->
                        <rect x="690" y="190" width="2" height="2" opacity="0.9" />
                        <rect x="705" y="190" width="2" height="2" opacity="0.7" />
                        <rect x="690" y="205" width="2" height="2" opacity="0.8" />
                        <rect x="705" y="205" width="2" height="2" opacity="0.6" />
                        <rect x="735" y="170" width="2" height="2" opacity="1" />
                        <rect x="750" y="170" width="2" height="2" opacity="0.8" />
                        <rect x="735" y="185" width="2" height="2" opacity="0.9" />
                        <rect x="750" y="185" width="2" height="2" opacity="0.7" />
                        <rect x="735" y="200" width="2" height="2" opacity="0.8" />
                        <rect x="772" y="205" width="2" height="2" opacity="0.9" />
                        <rect x="772" y="220" width="2" height="2" opacity="0.7" />
                        <rect x="805" y="225" width="2" height="2" opacity="0.8" />

                        <!-- Lights for Right Cluster -->
                        <rect x="1105" y="235" width="2" height="2" opacity="0.7" />
                        <rect x="1138" y="215" width="2" height="2" opacity="0.8" />
                        <rect x="1150" y="215" width="2" height="2" opacity="0.6" />
                        <rect x="1138" y="230" width="2" height="2" opacity="0.9" />
                        <rect x="1150" y="230" width="2" height="2" opacity="0.7" />
                        <rect x="1138" y="245" width="2" height="2" opacity="0.8" />
                        <rect x="1175" y="250" width="2" height="2" opacity="0.6" />
                        <rect x="1210" y="225" width="2" height="2" opacity="0.8" />
                    </g>
                </svg>
            </div>

        </div>

        <!-- Hub Stage: groups the hero panel + dock so one transform slides them
             together (centered on load, top on select). -->
        <div class="hub-stage" id="hub-stage">

            <!-- Welcome Intro: glass panel on load, collapses to a slim header on select -->
            <div class="hero-intro" id="hero-intro-content">
                <p class="eyebrow">Kenn's Workspace</p>
                <h1>Web Tools</h1>
                <p class="hero-copy">Pick a tool that fits your need. I will add more tools as I develop them.</p>
            </div>

            <!-- Main Header Navigation (The Dock) -->
            <header class="hub-header" id="hub-header">
                <nav class="hub-dock" id="hub-dock-nav" aria-label="Web Tools Dock">
                    <button class="dock-item" data-tool="schedule-plotter" aria-label="Schedule Plotter">
                        <span class="dock-surface">
                            <img class="dock-icon" src="./src/assets/icons/schedule-plotter.png" alt="Schedule Plotter">
                            <span class="dock-label">Schedule Plotter</span>
                        </span>
                        <span class="dock-tooltip">
                            <span class="tooltip-title">Schedule Plotter</span>
                            <span class="tooltip-meta">v__VERSION_SCHEDULE_PLOTTER__ • Web</span>
                        </span>
                    </button>
                    <button class="dock-item" data-tool="portal-parser" aria-label="Pre-requisite Mapping">
                        <span class="dock-surface">
                            <img class="dock-icon" src="./src/assets/icons/portal-parser.png"
                                alt="Pre-requisite Mapping">
                            <span class="dock-label">Pre-requisite Mapping</span>
                        </span>
                        <span class="dock-tooltip">
                            <span class="tooltip-title">Pre-requisite Mapping</span>
                            <span class="tooltip-meta">v__VERSION_PREREQUISITE_MAPPING__ • Web</span>
                        </span>
                    </button>
                    <button class="dock-item" data-tool="active-page-utility" aria-label="Active-Page Utility">
                        <span class="dock-surface">
                            <img class="dock-icon" src="./src/assets/icons/active-page-utility.png"
                                alt="Active-Page Utility">
                            <span class="dock-label">Active-Page Utility</span>
                        </span>
                        <span class="dock-tooltip">
                            <span class="tooltip-title">Active-Page Utility</span>
                            <span class="tooltip-meta">v__VERSION_ACTIVE_PAGE_UTILITY__ • Extension</span>
                        </span>
                    </button>
                    <button class="dock-item" data-tool="companion-page" aria-label="Web Tools Companion">
                        <span class="dock-surface">
                            <img class="dock-icon" src="./src/assets/icons/companion-page.png"
                                alt="Web Tools Companion">
                            <span class="dock-label">Web Tools Companion</span>
                        </span>
                        <span class="dock-tooltip">
                            <span class="tooltip-title">Web Tools Companion</span>
                            <span class="tooltip-meta">v__VERSION_WEB_TOOLS_COMPANION__ • Extension</span>
                        </span>
                    </button>
                    <button class="dock-item" data-tool="pka-toolkit" aria-label="pka-toolkit" aria-disabled="false"
                        tabindex="-1">
                        <span class="dock-surface">
                            <img class="dock-icon" src="./src/assets/icons/pka-toolkit.png" alt="pka-toolkit">
                            <span class="dock-label">Tracer Toolkit</span>
                        </span>
                        <span class="dock-tooltip">
                            <span class="tooltip-title">pka-toolkit</span>
                            <span class="tooltip-meta">Coming Soon • Native, Web, CLI</span>
                        </span>
                    </button>
                </nav>
            </header>

        </div>
        <!-- /hub-stage -->

        <!-- Preview Glassmorphic Card -->
        <section class="hero-card" id="hero-card-panel">
            <!-- Preview Panel -->
            <div class="hub-preview" id="hub-preview-panel">
                <div class="preview-content-wrap">
                    <div class="preview-details">
                        <span class="preview-kicker" id="prev-kicker"></span>
                        <h2 class="preview-title" id="prev-title"></h2>
                        <p class="preview-description" id="prev-desc"></p>

                        <h3 class="features-header">Key Features</h3>
                        <ul class="preview-features" id="prev-features"></ul>

                        <div class="preview-actions">
                            <a href="#" class="btn btn-plot" id="prev-launch-btn">
                                <span class="iconify btn-icon" data-icon="mdi:rocket-launch-outline"></span>
                                <span id="prev-launch-text">Launch Tool</span>
                            </a>
                            <div class="platform-tags" id="prev-tags"></div>
                        </div>
                    </div>

                    <!-- Visual mockup canvas -->
                    <div class="preview-visual">
                        <div class="visual-canvas" id="prev-visual-canvas"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <script type="module" src="./src/scripts/page-transition.js"></script>
    <script type="module" src="./src/scripts/home.js"></script>
</body>

</html>
